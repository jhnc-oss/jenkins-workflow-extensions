name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: "release hpi"
    steps:
      - name: Build
        uses: offa/maven-action@1d0ec88d20ef83a5814d041d376760970324aab4
        with:
          java-version: 21
          pmd: false
      - name: Checksum
        run: |
          cd target/
          for f in *.hpi; do sha256sum "$f" | tee "$f.sha256"; done
      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        if: github.ref_type == 'tag'
        with:
          files: |
            target/*.hpi
            target/*.hpi.sha256
